services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: sailcloth
      POSTGRES_USER: sailcloth
      POSTGRES_PASSWORD: sailcloth
    ports:
      - "6150:5432"
    volumes:
      - sailcloth_3750_8750_6150_pg:/var/lib/postgresql/data
    # 首次 initdb 时频繁 healthcheck 会卡住临时库关停，故改为仅等容器启动
    # healthcheck:
    #   test: ["CMD-SHELL", "pg_isready -U sailcloth -d sailcloth"]
    #   interval: 5s
    #   timeout: 5s
    #   retries: 30
    #   start_period: 40s

  backend:
    build: ./backend
    environment:
      DJANGO_SECRET_KEY: sailcloth-dev-secret-key-change-me
      DJANGO_DEBUG: "1"
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      POSTGRES_DB: sailcloth
      POSTGRES_USER: sailcloth
      POSTGRES_PASSWORD: sailcloth
      ALLOWED_HOSTS: "*"
      CORS_ALLOWED_ORIGINS: "http://localhost:3750,http://127.0.0.1:3750"
    ports:
      - "8750:8000"
    depends_on:
      - db
    volumes:
      - ./backend:/app

  frontend:
    build: ./frontend
    ports:
      - "3750:80"
    depends_on:
      - backend

volumes:
  sailcloth_3750_8750_6150_pg: